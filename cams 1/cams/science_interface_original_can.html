<title>Science Interface</title>
<style>

    --bar: #861812;          /* üst ve alt bordo şerit */
    --bar-edge: #5a0d09;
    --bg: #eceef1;           /* açık gri arka plan */
    --panel: #ffffff;        /* kart / kolon arka planı */
    --ink: #1a1a1a;          /* metin */
    --grid: #d8d8d8;         /* ızgara çizgileri */
    --axis: #333;            /* eksen */
    --card-border: #d9dbdf;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI", Arial, sans-serif;
    padding-bottom:26px;
  }

  .topbar > *{ position:relative; z-index:1; }
  .topbar h1{ margin:0; font-size:26px; font-weight:800; letter-spacing:.3px; }
  .topbar .brand{ display:flex; align-items:center; gap:14px; }
  .topbar .team{
    text-align:right; line-height:1.15;
    font-size:13px; font-weight:700; letter-spacing:3px;
    color:#f3dede;
    border-right:1px solid rgba(255,255,255,.35);
    padding-right:14px;
  }
  .topbar .logo{ height:56px; width:auto; display:block; }

  /* Alt şerit */
  .bottombar{
    position:fixed; left:0; right:0; bottom:0;
    height:14px; background:var(--bar); border-top:3px solid var(--bar-edge);
  }

  .wrap{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
    padding:22px;
    max-width:1900px; margin:0 auto;
  }
  @media (max-width: 1000px){ .wrap{ grid-template-columns:1fr; } }

  .column{
    background:#ffffff;
    border:1px solid var(--card-border);
    border-radius:6px;
    padding:16px 18px 22px;
  }
  .column > h2{
    text-align:center;
    font-size:22px;
    letter-spacing:2px;
    margin:6px 0 4px;
    padding-bottom:10px;
    border-bottom:2px solid #c3c5c9;
  }

  .cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:14px;
  }
  @media (max-width: 560px){ .cards{ grid-template-columns:1fr; } }

  .card{
    border:1px solid var(--card-border);
    border-radius:6px;
    padding:8px 10px 6px;
    background:#fff;
    box-shadow:0 1px 3px rgba(30,20,18,0.07);
  }
  /* tek başına kalan kartı ortalamak / geniş yapmak istersek */
  .card.wide{ grid-column:1 / -1; }

  .card h3{
    text-align:center;
    font-size:14px;
    margin:2px 0 6px;
    font-weight:700;
  }
  .card h3 sub{ font-size:0.68em; }
  .card svg{ display:block; width:100%; height:auto; }
</style>

<script>
/* =========================================================================
   AYAR BLOĞU  —  renkleri ve aralıkları BURADAN değiştiriyoruz
   -------------------------------------------------------------------------
   Her sensör için:
     id      : benzersiz kod (veri güncellemede kullanılır)
     label   : kartta görünen başlık
     unit    : y ekseni birimi
     min,max : y ekseni alt/üst sınırı
     color   : çizgi + dolgu rengi (tek sabit renk)
     ticks   : y ekseninde gösterilecek değerler (opsiyonel)
     data    : kendi değerlerin. [] verirsen otomatik demo verisi üretilir.
   ========================================================================= */

const CONFIG = {
  points: 25,                 // her grafikteki nokta sayısı (zaman adedi)
  timeStart: "10:06",         // x ekseni başlangıç saati
  timeStepMin: 2,             // saat adımı (dakika)

  lineColor: "#660000",       // grafik çizgisi ve noktalar (bordo)
  fillOpacity: 1,          // iç dolgu şeffaflığı (0=görünmez, 1=tam)
  showGrid: false,            // arka plan ızgara çizgileri (true yaparsan geri gelir)
  showTimeLabels: false,      // alt eksendeki saat etiketleri (x ekseni sonra tasarlanacak)

  // labels : y ekseninde SAYI yazılacak değerler (uzun çizgi + rakam)
  // minor  : sayısız kısa çizgiklerin aralığı
  // fine   : {step, to} -> alt aralıkta çok ince ek çizgikler (nh3 gibi)
  atmosphere: [
    { id:"o2",   label:"O<sub>2</sub> (%)",    unit:"%",   min:0,   max:50,   color:"#ffffff", labels:[20,50],           minor:10,  fine:{step:1, from:20, to:30}, data:[] },
    { id:"co2",  label:"CO<sub>2</sub> (ppm)", unit:"ppm", min:0,   max:1000, color:"#ffffff", labels:[500,1000],        minor:100, data:[] },
    { id:"co",   label:"CO (ppm)",             unit:"ppm", min:0,   max:50,   color:"#ffffff", labels:[20,50],           minor:10,  data:[] },
    { id:"nh3",  label:"NH<sub>3</sub> (ppm)", unit:"ppm", min:0,   max:10,   color:"#ffffff", labels:[5,10],            minor:1,   fine:{step:0.2, to:1}, data:[] },
    { id:"press",label:"Pressure (hPa)",       unit:"hPa", min:300, max:1100, color:"#ffffff", labels:[800,1100],        minor:100, data:[] },
    { id:"hum",  label:"Humidity (%)",         unit:"%",   min:0,   max:100,  color:"#ffffff", labels:[50,100],          minor:10,  data:[] },
    { id:"atemp",label:"Temperature (°C)",     unit:"°C",  min:0,   max:60,   color:"#ffffff", labels:[20,40,60],        minor:10,  data:[] },
  ],

  soil: [
    { id:"stemp",label:"Temperature (°C)",  unit:"°C",    min:0, max:80,   color:"#ffffff", labels:[20,40,60,80],        minor:10,  data:[] },
    { id:"smois",label:"Soil Moisture (%)", unit:"%",     min:0, max:80,   color:"#ffffff", labels:[20,40,60,80],        minor:10,  data:[] },
    { id:"sal",  label:"Salinity (µS/cm)",  unit:"µS/cm", min:0, max:2000, color:"#ffffff", labels:[1000,2000],          minor:200, data:[] },
    { id:"ec",   label:"EC (µS/cm)",        unit:"µS/cm", min:0, max:2000, color:"#ffffff", labels:[500,1000,1500,2000], minor:100, data:[] },
  ],
};

/* =========================================================================
   Buradan aşağısı çizim motoru — normalde dokunmana gerek yok.
   ========================================================================= */

// zaman etiketleri üret
function timeLabels(count = CONFIG.points){
  const [h,m] = CONFIG.timeStart.split(":").map(Number);
  const out=[]; let total=h*60+m;
  for(let i=0;i<count;i++){
    const hh=String(Math.floor(total/60)%24).padStart(2,"0");
    const mm=String(total%60).padStart(2,"0");
    out.push(`${hh}:${mm}`);
    total+=CONFIG.timeStepMin;
  }
  return out;
}

// demo verisi: min-max arasında yumuşak dalgalı
function demoData(s){
  const arr=[]; const span=s.max-s.min;
  let v = s.min + span*(0.35+Math.random()*0.2);
  for(let i=0;i<CONFIG.points;i++){
    v += (Math.random()-0.5)*span*0.18;
    v = Math.max(s.min, Math.min(s.max, v));
    arr.push(Math.round(v*100)/100);
  }
  return arr;
}

// tek bir sensör kartını SVG olarak çiz
function renderCard(s, times){
  const W=340, H=150;
  const padL=44, padR=12, padT=14, padB=34;
  const plotW=W-padL-padR, plotH=H-padT-padB;

  // Kaydedilmiş bütün 30 saniyelik örnekleri çiz.
  // Kayıt sayısı sınırsızdır; grafik tüm noktaları alana sıkıştırır.
  const data = (s.data && s.data.length)
    ? s.data
    : [];
  const min=s.min, max=s.max, range=(max-min)||1;

  const pointCount = Math.max(2, data.length);
  const x = i => padL + (plotW * i/(pointCount-1));
  const y = v => padT + plotH * (1-(v-min)/range);

  // Her 30 saniyelik kayıt nokta olarak çizilir ve noktalar çizgiyle bağlanır.
  let linePath = "";
  let pointsSvg = "";

  data.forEach((v, i)=>{
    const cmd = i===0 ? "M" : "L";
    linePath += `${cmd} ${x(i).toFixed(1)} ${y(v).toFixed(1)} `;
  });

  data.forEach((v, i)=>{
    pointsSvg += `
      <circle
        cx="${x(i).toFixed(1)}"
        cy="${y(v).toFixed(1)}"
        r="2.2"
        fill="${CONFIG.lineColor}"
        stroke="#ffffff"
        stroke-width="0.7"
      />`;
  });

  // y ekseni: kısa çizgikler (minor) + çok ince çizgikler (fine) + etiketli sayılar
  let yAxis="";
  const tickMark = (val, len) => {
    const yy = y(val);
    return `<line x1="${(padL-len).toFixed(1)}" y1="${yy.toFixed(1)}" x2="${padL}" y2="${yy.toFixed(1)}" stroke="#333" stroke-width="1"/>`;
  };
  // arka plan ızgarası isteğe bağlı (showGrid true ise yatay çizgi çeker)
  const gridLine = val => `<line x1="${padL}" y1="${y(val).toFixed(1)}" x2="${W-padR}" y2="${y(val).toFixed(1)}" stroke="var(--grid)" stroke-width="0.6"/>`;

  // minor çizgikler
  if(s.minor){
    for(let v=min; v<=max+1e-6; v+=s.minor){
      const val = Math.round(v*1000)/1000;
      if(CONFIG.showGrid) yAxis += gridLine(val);
      yAxis += tickMark(val, 4);
    }
  }
  // fine (çok ince) çizgikler — alt aralıkta (from..to)
  if(s.fine){
    const f0 = (s.fine.from !== undefined) ? s.fine.from : min;
    for(let v=f0; v<=s.fine.to+1e-6; v+=s.fine.step){
      yAxis += tickMark(Math.round(v*1000)/1000, 2.5);
    }
  }
  // etiketli değerler: uzun çizgi + sayı
  (s.labels||[]).forEach(t=>{
    yAxis += tickMark(t, 6);
    yAxis += `<text x="${padL-8}" y="${(y(t)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#333">${t}</text>`;
  });

  // x ekseni dikey ızgara + saat etiketleri (seyrek)
  let xAxis="";
  const every = Math.max(1, Math.round(CONFIG.points/12));
  times.forEach((t,i)=>{
    const xx=x(i);
    if(CONFIG.showGrid){
      xAxis += `<line x1="${xx}" y1="${padT}" x2="${xx}" y2="${padT+plotH}" stroke="var(--grid)" stroke-width="0.5"/>`;
    }
    if(CONFIG.showTimeLabels && i % every === 0){
      xAxis += `<text x="${xx}" y="${padT+plotH+10}" text-anchor="end" font-size="7.5" fill="#555" transform="rotate(-60 ${xx} ${padT+plotH+10})">${t}</text>`;
    }
  });

  return `
  <div class="card${s.wide?' wide':''}">
    <h3>${s.label}</h3>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${yAxis}
      ${xAxis}
      <path
        d="${linePath}"
        fill="none"
        stroke="${CONFIG.lineColor}"
        stroke-width="1.2"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
      ${pointsSvg}
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" stroke="var(--axis)" stroke-width="1"/>
      <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--axis)" stroke-width="1"/>
      <text x="10" y="${padT+plotH/2}" text-anchor="middle" font-size="9" fill="#333" transform="rotate(-90 10 ${padT+plotH/2})">${s.unit}</text>
    </svg>
  </div>`;
}

function renderColumn(title, sensors, times){
  const cards = sensors.map(s=>renderCard(s, times)).join("");
  return `<section class="column"><h2>${title}</h2><div class="cards">${cards}</div></section>`;
}

function draw(){
  const allSensors = [...CONFIG.atmosphere, ...CONFIG.soil];
  const maxPointCount = Math.max(
    1,
    ...allSensors.map(sensor => sensor.data ? sensor.data.length : 0)
  );
  const times = timeLabels(maxPointCount);

  document.getElementById("wrap").innerHTML =
    renderColumn("ATMOSPHERE", CONFIG.atmosphere, times) +
    renderColumn("SOIL", CONFIG.soil, times);
}
draw();

/* =========================================================================
   GERÇEK VERİYE BAĞLAMA (gömülü ekip verisi geldiğinde)
   -------------------------------------------------------------------------
   Bir sensörün verisini güncellemek için:
       setSensorData("o2", [21.1, 20.8, 21.4, ...]);   // dizi ver
       draw();
   Ya da canlı akış için aşağıdaki iskeleti aç:

   // setInterval(async ()=>{
   //   const r = await fetch("/api/sensors");   // ekibin endpoint'i
   //   const j = await r.json();                // { o2:[...], co2:[...], ... }
   //   Object.keys(j).forEach(id => setSensorData(id, j[id]));
   //   draw();
   // }, 2000);
   ========================================================================= */

const SENSOR_ID_MAP = {
  salinity: "sal"
};

let lastReceivedFrames = -1;

async function updateFromCan(){
  try{
    const response = await fetch(`/api/sensors?t=${Date.now()}`, {
      cache: "no-store"
    });

    if(!response.ok){
      throw new Error(`HTTP ${response.status}`);
    }

    const json = await response.json();

    // Hem doğrudan {"o2":[...]} hem de {"sensors":{"o2":[...]}}
    // biçimini destekle.
    const sensors = (json && json.sensors) ? json.sensors : json;

    Object.entries(sensors).forEach(([serverId, values])=>{
      const interfaceId = SENSOR_ID_MAP[serverId] || serverId;

      if(!Array.isArray(values)){
        values = [values];
      }

      const numericValues = values
        .map(Number)
        .filter(Number.isFinite);

      setSensorData(interfaceId, numericValues);
    });

    draw();
  }catch(error){
    console.warn("CAN sensör verileri alınamadı:", error);
  }
}

updateFromCan();
setInterval(updateFromCan, 100);

function setSensorData(id, arr){
  for(const grp of [CONFIG.atmosphere, CONFIG.soil]){
    const s = grp.find(x=>x.id===id);
    if(s){ s.data = arr; return true; }
  }
  console.warn("Sensör bulunamadı:", id);
  return false;
}
</script>
